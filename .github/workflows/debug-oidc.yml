name: debug-oidc

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show role ARN variable
        run: echo "AWS_ROLE_ARN=[${{ vars.AWS_ROLE_ARN }}]"

      - name: Show OIDC claims (not the token)
        run: |
          export TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import os,json,base64;p=os.environ['TOKEN'].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:d.get(k) for k in ['iss','aud','sub','repository','ref']},indent=2))"